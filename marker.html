<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcane Chemistry | Marker AR</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  
  <!-- Fix 2: Added inline margin and overflow constraints to prevent the camera from hiding -->
  <body class="ar-page marker-page" style="margin: 0px; overflow: hidden;">
    
    <!-- Make sure your CSS for .hud has position: absolute and z-index: 10 or higher so it sits over the camera -->
    <div class="hud top-bar" style="position: absolute; z-index: 10;">
      <button class="ghost-button" onclick="window.location.href='index.html'">Home</button>
      <div class="hud-panel small">
        <strong>Marker AR</strong>
        <span id="marker-status">Looking for marker…</span>
      </div>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Fix 1: Changed .png to .patt -->
      <a-marker type="pattern" url="assets/markers/pattern-spellbook.patt" id="custom-marker">
        <a-light type="point" intensity="1.8" distance="5" position="0 2 1"></a-light>
        <a-entity
          id="spellbook"
          gltf-model="assets/models/spellbook.glb"
          position="0 0.5 0"
          rotation="0 90 0"
          scale="0.32 0.32 0.32"
        ></a-entity>
      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>

    <script src="js/marker-scene.js"></script>
  </body>
</html>
