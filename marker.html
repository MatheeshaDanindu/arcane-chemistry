<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Prevents the camera from zooming in too much on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Arcane Chemistry | Marker AR</title>
    
    <!-- <link rel="stylesheet" href="css/style.css" /> -->
    
    <!-- Using A-Frame 1.3.0 for guaranteed AR.js stability -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
  </head>
  
  <!-- Strict margins and hidden overflow to prevent the camera video from being pushed off-screen -->
  <body class="ar-page marker-page" style="margin: 0px; overflow: hidden;">
    
    <!-- HUD / UI Overlay -->
    <!-- (Ensuring absolute positioning and a high z-index so it sits on top of the camera) -->
    <div class="hud top-bar" style="position: absolute; top: 10px; left: 10px; z-index: 1000;">
      <button class="ghost-button" onclick="window.location.href='index.html'">Home</button>
      <div class="hud-panel small" style="display: inline-block; margin-left: 10px; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 5px; font-family: sans-serif;">
        <strong>Marker AR</strong>
        <span id="marker-status">Looking for marker…</span>
      </div>
    </div>

    <!-- AR Scene with fixed resolution to stop the zoomed-in effect -->
    <a-scene 
      embedded 
      arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false;"
      vr-mode-ui="enabled: false">
      
      <!-- Asset Management: preloading the page texture prevents it popping in late -->
      <a-assets>
        <img id="page-texture" src="assets/textures/spellbook-page.png" crossorigin="anonymous" />
      </a-assets>

      <!-- The Custom Marker -->
      <!-- Make sure the URL perfectly matches your generated .patt file -->
      <a-marker type="pattern" url="./assets/markers/spellbook-marker.patt" id="custom-marker">
        
        <!-- Lighting to make sure the model is clearly visible -->
        <a-light type="ambient" intensity="1.2"></a-light>
        <a-light type="point" intensity="1.8" distance="5" position="0 2 1"></a-light>
        
        <!-- The spellbook, built entirely from A-Frame primitives (no GLB) -->
        <!-- Boxes are axis-aligned by default, so it rests flat on the marker with no rotation hacks -->
        <a-entity id="spellbook" position="0 0 0" rotation="0 0 0" scale="0.001 0.001 0.001">

          <!-- spine / binding -->
          <a-box color="#2a1b12" width="0.05" height="0.05" depth="0.34" position="0 0.025 0" roughness="0.85" metalness="0.05"></a-box>
          <a-box color="#f4d35e" width="0.052" height="0.014" depth="0.07" position="0 0.053 0" roughness="0.3" metalness="0.6"></a-box>

          <!-- left half: gold trim -> leather cover -> parchment block -> printed page -->
          <a-box color="#f4d35e" width="0.27" height="0.01" depth="0.32" position="-0.16 0.005 0" roughness="0.3" metalness="0.6"></a-box>
          <a-box color="#2a1b12" width="0.25" height="0.014" depth="0.30" position="-0.16 0.014 0" roughness="0.85" metalness="0.05"></a-box>
          <a-box color="#ecdfb8" width="0.22" height="0.012" depth="0.27" position="-0.16 0.027 0" roughness="0.9"></a-box>
          <a-plane
            width="0.22" height="0.27"
            rotation="-90 0 0"
            position="-0.16 0.0335 0"
            material="src: #page-texture; repeat: 0.46 0.94; offset: 0.02 0.03; shader: flat"
          ></a-plane>

          <!-- right half: mirror of the left, sampling the right side of the same page texture -->
          <a-box color="#f4d35e" width="0.27" height="0.01" depth="0.32" position="0.16 0.005 0" roughness="0.3" metalness="0.6"></a-box>
          <a-box color="#2a1b12" width="0.25" height="0.014" depth="0.30" position="0.16 0.014 0" roughness="0.85" metalness="0.05"></a-box>
          <a-box color="#ecdfb8" width="0.22" height="0.012" depth="0.27" position="0.16 0.027 0" roughness="0.9"></a-box>
          <a-plane
            width="0.22" height="0.27"
            rotation="-90 0 0"
            position="0.16 0.0335 0"
            material="src: #page-texture; repeat: 0.46 0.94; offset: 0.52 0.03; shader: flat"
          ></a-plane>

          <!-- floating arcane gem, purely decorative -->
          <a-octahedron
            radius="0.03"
            position="0 0.09 0"
            material="color: #8b5cf6; emissive: #77d5f8; emissiveIntensity: 0.5; metalness: 0.2; roughness: 0.3"
            animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
            animation__bob="property: position; to: 0 0.105 0; dir: alternate; loop: true; dur: 1800; easing: easeInOutSine"
          ></a-octahedron>

          <!-- generous invisible hit target so taps register reliably on a small phone screen -->
          <a-box
            class="tappable-spellbook"
            click-to-open
            width="0.66" height="0.16" depth="0.36"
            position="0 0.05 0"
            material="opacity: 0; transparent: true"
          ></a-box>

          <!-- Recipe page: hinged at the spine (x = 0) so it can flip open like a real page. -->
          <!-- The leaf rests directly over the right-hand printed page (x = 0.16), so the -->
          <!-- recipe reads as being written on the book itself instead of floating above it. -->
          <!-- Nested inside #spellbook (not a sibling) so it scales and moves as one unit with the book. -->
          <a-entity id="recipe-hinge" position="0 0.0345 0" rotation="0 0 0">
            <a-entity id="recipe-leaf" visible="false" position="0.16 0 0" rotation="-90 0 0">
              <a-plane class="tappable-recipe-page" width="0.26" height="0.32" color="#f4e7bd" material="shader: flat; side: double"></a-plane>
              <a-text id="recipe-title" value="Potion Recipe" align="center" color="#2a183d" width="0.62" wrap-count="22" position="0 0.105 0.003"></a-text>
              <a-text id="recipe-content" value="" align="center" color="#3b2850" width="0.52" wrap-count="40" position="0 -0.015 0.003"></a-text>
              <a-text value="&#8249; swipe to turn the page &#8250;" align="center" color="#8a6a34" width="0.36" wrap-count="34" position="0 -0.13 0.003"></a-text>
            </a-entity>
          </a-entity>

          <!-- Also nested inside #spellbook so the glow/rings/motes scale with the book. -->
          <a-entity id="spellbook-effects" visible="false">
            <a-ring id="rune-ring" position="0 0.025 0" radius-inner="0.28" radius-outer="0.31" rotation="-90 0 0" color="#f4d35e" material="shader: flat; transparent: true; opacity: 0.9"></a-ring>
            <a-ring position="0 0.03 0" radius-inner="0.42" radius-outer="0.425" rotation="-90 0 0" color="#77d5f8" material="shader: flat; transparent: true; opacity: 0.72"></a-ring>
            <a-plane position="0 0.27 0" width="0.82" height="0.62" rotation="-90 0 0" color="#f4d35e" material="shader: flat; transparent: true; opacity: 0.12"></a-plane>
            <a-sphere class="magic-mote" position="-0.42 0.2 0.1" radius="0.025" color="#77d5f8" material="shader: flat; transparent: true; opacity: 0.9"></a-sphere>
            <a-sphere class="magic-mote" position="0.38 0.3 -0.08" radius="0.02" color="#f4d35e" material="shader: flat; transparent: true; opacity: 0.85"></a-sphere>
            <a-sphere class="magic-mote" position="0.16 0.48 0.14" radius="0.018" color="#7ef0c5" material="shader: flat; transparent: true; opacity: 0.9"></a-sphere>
            <a-sphere class="magic-mote" position="-0.22 0.42 -0.12" radius="0.016" color="#f4d35e" material="shader: flat; transparent: true; opacity: 0.8"></a-sphere>
            <a-sphere class="magic-mote" position="0.48 0.18 0.12" radius="0.014" color="#77d5f8" material="shader: flat; transparent: true; opacity: 0.8"></a-sphere>
          </a-entity>

        </a-entity>

      </a-marker>
      
      <a-entity camera cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .tappable-spellbook, .tappable-recipe-page; far: 20"></a-entity>
    </a-scene>

    <script src="js/marker-scene.js"></script>
  </body>
</html>
