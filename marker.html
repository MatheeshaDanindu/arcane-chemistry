<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Arcane Chemistry | Safe Mode Test</title>
    <!-- 1. DOWNGRADED A-FRAME TO 1.3.0 -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  
  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
  
        <!-- Pre-load your 3D model here -->
        <a-assets>
            <a-asset-item id="spellbook-model" src="assets/models/spellbook.glb"></a-asset-item>
        </a-assets>

        <a-marker type="pattern" url="./assets/markers/spellbook-marker.patt">
            
            <!-- Use the pre-loaded model -->
            <a-entity 
            gltf-model="#spellbook-model" 
            scale="0.3 0.3 0.3" 
            position="0 0 0" 
            rotation="-90 0 0">
            </a-entity>
            
        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>

  </body>
</html>
