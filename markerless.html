<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcane Chemistry | Markerless AR</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body class="ar-page markerless-page">
    <div class="hud top-bar">
      <button class="ghost-button" onclick="window.location.href='index.html'">Home</button>
      <div class="hud-panel small">
        <strong>Markerless AR</strong>
        <span id="reaction-status">Tap START AR below to open the camera and scan a surface.</span>
      </div>
    </div>

    <video id="camera-fallback" autoplay playsinline muted></video>

    <div class="ingredient-ui">
      <div class="panel-heading">
        <div class="ingredient-header">Ingredients</div>
        <button class="collapse-button" id="ingredients-toggle" type="button" aria-expanded="true" aria-controls="ingredients-content" title="Collapse ingredients">-</button>
      </div>
      <div id="ingredients-content">
        <p class="ingredient-help" id="ingredient-help">Place your cauldron before choosing two reagents.</p>
        <div class="brew-progress" id="brew-progress" hidden>
          <div class="brew-progress-label">
            <span>Brewing enchantment</span>
            <strong id="brew-progress-value">0%</strong>
          </div>
          <div class="brew-progress-track" role="progressbar" aria-label="Brewing progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="brew-progress-fill" class="brew-progress-fill"></div>
          </div>
        </div>
        <div class="ingredient-grid">
          <button class="ingredient-btn" data-ingredient="vinegar" disabled>Vinegar</button>
          <button class="ingredient-btn" data-ingredient="baking_soda" disabled>Baking Soda</button>
          <button class="ingredient-btn" data-ingredient="copper_sulfate" disabled>Copper Sulfate</button>
          <button class="ingredient-btn" data-ingredient="iron" disabled>Iron Filings</button>
          <button class="ingredient-btn" data-ingredient="hydrochloric_acid" disabled>Hydrochloric Acid</button>
          <button class="ingredient-btn" data-ingredient="sodium_hydroxide" disabled>Sodium Hydroxide</button>
        </div>
        <div class="brew-actions">
          <button id="reset-brew-button" class="secondary-button" type="button" disabled>Clear Cauldron</button>
          <span id="brew-state">State: awaiting placement</span>
        </div>
      </div>
    </div>

    <aside class="potion-log" aria-live="polite">
      <div class="log-heading">
        <span>Wizard's Potion Log</span>
        <div class="log-heading-actions">
          <span id="data-source">Curated fallback ready</span>
          <button class="collapse-button" id="results-toggle" type="button" aria-expanded="true" aria-controls="results-content" title="Collapse potion log">-</button>
        </div>
      </div>
      <div id="results-content">
        <div id="reaction-result" class="reaction-result">No potion brewed yet.</div>
        <div id="reaction-history" class="reaction-history"></div>
      </div>
    </div>

    <script src="js/reaction-data.js"></script>
    <script type="module" src="js/markerless-scene.js"></script>
  </body>
</html>
